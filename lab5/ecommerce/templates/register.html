{% extends 'base.html' %}

{% block title %}Register &ndash; MUSHOP{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-head">
                <span class="logo-main"><span class="logo-mu">MU</span>SHOP</span>
                <p>Create your account and start shopping</p>
            </div>
            <div class="auth-body">
                <form>
                    <div class="form-group">
                        <label class="form-label" for="name">Full name</label>
                        <input type="text" id="name" class="form-control" placeholder="Your name">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-primary">{% include 'includes/icon.html' with name='user-plus' %} Register</button>
                </form>
            </div>
            <div class="auth-foot">
                Already have an account? <a href="{% url 'signin' %}">Sign in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
