{% extends 'base.html' %}

{% block title %}Sign in &ndash; MUSHOP{% endblock %}

{% block content %}
<div class="container">
    <div class="auth-wrap">
        <div class="auth-card">
            <div class="auth-head">
                <span class="logo-main"><span class="logo-mu">MU</span>SHOP</span>
                <p>Welcome back &mdash; sign in to continue shopping</p>
            </div>
            <div class="auth-body">
                <form>
                    <div class="form-group">
                        <label class="form-label" for="email">Email</label>
                        <input type="email" id="email" class="form-control" placeholder="you@example.com">
                    </div>
                    <div class="form-group">
                        <label class="form-label" for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="********">
                    </div>
                    <button type="submit" class="btn btn-primary">{% include 'includes/icon.html' with name='log-in' %} Sign in</button>
                </form>
            </div>
            <div class="auth-foot">
                Don&rsquo;t have an account? <a href="{% url 'register' %}">Register</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
